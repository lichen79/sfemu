[workspace]
resolver = "2"
members = [
    "crates/frontend",
    "crates/m68k",
    "crates/machine",
    "crates/oki",
    "crates/romset",
    "crates/sfemu",
    "crates/testrom",
    "crates/testrunner",
    "crates/video",
    "crates/ym2151",
    "crates/z80",
]

[workspace.package]
edition = "2021"
rust-version = "1.93"
# Stated here and inherited by every crate, so a new crate is licensed by
# default rather than by remembering. `LICENSE` at the workspace root is the
# text; this is the SPDX identifier a machine reads.
license = "MIT"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.bench]
inherits = "release"

# testdata parsing in debug mode is slow; speed up deps for tests
[profile.test]
opt-level = 2
