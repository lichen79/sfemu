[package]
name = "ym2151"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Yamaha YM2151 (OPM) FM sound chip core"

# Zero runtime dependencies, like `m68k` and `z80`. `serde` is optional and off
# by default so a save state can serialize the chip without the emulator
# carrying serde in the WASM path.
[dependencies]
serde = { version = "1", optional = true, default-features = false, features = ["derive"] }

[features]
default = ["std"]
std = []
serde = ["dep:serde"]
# Exposes the prepare-gate accessors outside this crate's own tests. Off by default
# and not enabled by anything in this workspace: `testrunner` runs the real chip, and
# a suite that could force eager preparation could hide the very bug the gate fixes.
internals = []
