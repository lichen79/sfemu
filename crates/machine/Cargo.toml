[package]
name = "machine"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

# `machine` must not gain `romset`: that would drag in miniz_oxide and std and
# forfeit the WASM posture sub-project A paid for. Both dependencies here are
# dependency-free `no_std`-shaped crates in this workspace, so the edge holds.
[dependencies]
m68k = { path = "../m68k" }
video = { path = "../video" }
# The sound board. Both are dependency-free and `no_std`-shaped, like the two
# above, so adding them does not weaken the edge the comment above protects.
ym2151 = { path = "../ym2151" }
z80 = { path = "../z80" }
